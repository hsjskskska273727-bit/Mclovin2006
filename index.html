
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ұпай жинау ойыны</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #141e30, #243b55);
    }

    h1 {
      margin-top: 30px;
      color: #ffd700;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 20px;
      font-size: 20px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #00e676;
      color: #102015;
    }

    #game {
      position: relative;
      width: 90%;
      max-width: 600px;
      height: 350px;
      margin: 25px auto;
      overflow: hidden;
      background: #ffffff;
      border: 4px solid #ffd700;
      border-radius: 18px;
    }

    #target {
      position: absolute;
      display: none;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #ff4081;
      color: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 0 18px #ff4081;
      padding: 0;
    }

    #message {
      font-size: 18px;
      min-height: 28px;
    }
  </style>
</head>

<body>
  <h1>🎯 Ұпай жина!</h1>
  <p>Нысананы басып, көбірек ұпай жина!</p>

  <div class="stats">
    <div>Ұпай: <span id="score">0</span></div>
    <div>Уақыт: <span id="time">30</span> сек</div>
  </div>

  <button id="startBtn">Ойынды бастау</button>

  <div id="game">
    <button id="target">★</button>
  </div>

  <p id="message">Дайын болсаң, ойынды баста!</p>

  <script>
    const game = document.getElementById("game");
    const target = document.getElementById("target");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const startBtn = document.getElementById("startBtn");
    const message = document.getElementById("message");

    let score = 0;
    let time = 30;
    let timer;
    let playing = false;

    function moveTarget() {
      const maxX = game.clientWidth - target.offsetWidth;
      const maxY = game.clientHeight - target.offsetHeight;

      target.style.left = Math.random() * maxX + "px";
      target.style.top = Math.random() * maxY + "px";
    }

    startBtn.addEventListener("click", () => {
      clearInterval(timer);

      score = 0;
      time = 30;
      playing = true;

      scoreText.textContent = score;
      timeText.textContent = time;
      message.textContent = "Жылдам бас! ⭐";
      target.style.display = "block";
      startBtn.textContent = "Қайта бастау";

      moveTarget();

      timer = setInterval(() => {
        time--;
        timeText.textContent = time;

        if (time <= 0) {
          clearInterval(timer);
          playing = false;
          target.style.display = "none";
          message.textContent =
            "🎉 Ойын аяқталды! Сенің ұпайың: " + score;
          startBtn.textContent = "Қайта ойнау";
        }
      }, 1000);
    });

    target.addEventListener("click", () => {
      if (!playing) return;

      score++;
      scoreText.textContent = score;
      moveTarget();
    });
  </script>
</body>
</html>
